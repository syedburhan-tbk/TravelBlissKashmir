
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Bliss Kashmir | Elite Concierge Proposal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- Load html2pdf bundle script directly for better compatibility -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      /* 
         Enhanced PDF Zone: Using off-screen position.
         Capture libraries like html2canvas fail if visibility is hidden.
         We move it far to the left to keep it 'renderable' but out of user sight.
      */
      #pdf-render-zone {
        position: absolute;
        top: 0;
        left: -5000px;
        width: 210mm; /* A4 Width */
        background-color: white;
        z-index: -9999;
        pointer-events: none;
      }
      @media print {
        .no-print { display: none !important; }
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Container for off-screen PDF rendering -->
    <div id="pdf-render-zone"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
